name: Compila e pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  compila:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Installa LaTeX
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-extra \
            texlive-lang-italian lmodern

      - name: Compila i documenti e prepara il sito
        run: python3 scripts/compila.py

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: compila
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
